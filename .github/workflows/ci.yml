name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'apps/api/requirements*.txt'
      - run: python -m pip install -r apps/api/requirements-dev.txt -r apps/api/requirements-coach.txt
      - run: python -m ruff check apps/api scripts
      - run: python -m ruff format --check apps/api scripts
      - run: python -m pytest -q
        working-directory: apps/api
      - run: python scripts/export_contracts.py --check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
